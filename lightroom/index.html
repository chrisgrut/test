<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dunkelkammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Lightroom-artiges Studio – Modulleiste oben, Werkzeugpaletten links/rechts, neutrale Bühne in der Mitte, Filmstreifen unten.
   Bewusst nur ein dunkles Thema: Bilder werden auf neutralem Grau beurteilt, Farbstiche in der UI würden das Auge täuschen. */
:root{
  color-scheme: dark;
  --ink-0:#111112;      /* Modulleiste, Filmstreifen */
  --ink-1:#1b1b1c;      /* Paletten */
  --ink-2:#252526;      /* Felder, Kopfzeilen */
  --ink-3:#303032;      /* Hover */
  --stage:#2d2d2d;      /* neutrales Grau hinter dem Bild (kein Farbstich) */
  --line:#3a3a3c;
  --text:#d4d4d4;
  --text-dim:#8e8e92;
  --text-bright:#f4f4f4;
  --safelight:#e0703c; /* Dunkelkammer-Rotlicht als einziger Akzent */
  --safelight-soft:rgba(224,112,60,.18);
  --ok:#7fbf6a;
  --danger:#e05a4f;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --left-w:244px; --right-w:300px; --film-h:92px; --top-h:46px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--ink-0);color:var(--text);font:13px/1.4 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--safelight);outline-offset:1px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:var(--left-w) minmax(0,1fr) var(--right-w);grid-template-rows:var(--top-h) minmax(0,1fr) var(--film-h);grid-template-areas:"top top top" "left center right" "film film film"}
#app.hide-panels{grid-template-columns:0 minmax(0,1fr) 0}
#app.hide-panels .side{display:none}

/* Modulleiste */
.topbar{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--ink-0);border-bottom:1px solid #000}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.02em;color:var(--text-bright);white-space:nowrap}
.brand-mark{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb38a,var(--safelight) 55%,#7a2c10);box-shadow:0 0 12px rgba(224,112,60,.45)}
.brand small{font-weight:400;color:var(--text-dim);letter-spacing:0}
.modules{display:flex;gap:2px;margin-left:auto}
.modules button{background:none;border:0;padding:6px 12px;color:var(--text-dim);font-size:15px;letter-spacing:.01em;border-bottom:2px solid transparent}
.modules button:hover{color:var(--text)}
.modules button[aria-pressed="true"]{color:var(--text-bright);border-bottom-color:var(--safelight)}
.top-actions{display:flex;gap:6px}
.btn{background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:5px 10px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--ink-3);color:var(--text-bright)}
.btn.primary{background:var(--safelight);border-color:var(--safelight);color:#1a0d06;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--safelight);color:#1a0d06}
.btn.small{padding:3px 8px;font-size:12px}
.btn.icon{padding:4px 8px;min-width:30px}
.btn[aria-pressed="true"]{background:var(--safelight-soft);border-color:var(--safelight);color:var(--text-bright)}
.btn:disabled{opacity:.4;cursor:default}

/* Seitenpaletten */
.side{background:var(--ink-1);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#444 transparent}
.side.left{grid-area:left;border-right:1px solid #000}
.side.right{grid-area:right;border-left:1px solid #000}
.pane[hidden]{display:none!important}
.sec{border-bottom:1px solid #0c0c0c}
.sec-h{width:100%;display:flex;align-items:center;gap:8px;background:var(--ink-2);border:0;padding:7px 12px;text-align:left;color:var(--text);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sec-h::after{content:"";margin-left:auto;border:4px solid transparent;border-top-color:var(--text-dim);transform:translateY(2px)}
.sec.closed .sec-h::after{transform:rotate(90deg) translateX(1px)}
.sec.closed .sec-b{display:none}
.sec-h .sec-x{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-dim)}
.sec-b{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px}
.sub-h{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--text-dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.sub-h:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.dim{color:var(--text-dim)}
select.sel{background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:3px 6px;min-width:0}

/* Regler */
.sl{display:grid;grid-template-columns:86px minmax(0,1fr) 46px;align-items:center;gap:8px;min-height:22px}
.sl-label{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;user-select:none}
.sl-num{width:46px;background:transparent;border:1px solid transparent;border-radius:2px;text-align:right;padding:1px 3px;font:12px var(--font-num);font-variant-numeric:tabular-nums;color:var(--text)}
.sl-num:hover{border-color:var(--line)}
.sl-num:focus{border-color:var(--safelight);background:var(--ink-0);outline:none}
.sl.changed .sl-label{color:var(--text-bright)}
input[type=range].sl-range{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer;--a:50%;--b:50%;--track:linear-gradient(var(--line),var(--line))}
input[type=range].sl-range::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,transparent var(--a),rgba(255,255,255,.55) var(--a),rgba(255,255,255,.55) var(--b),transparent var(--b)),var(--track)}
input[type=range].sl-range::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,transparent var(--a),rgba(255,255,255,.55) var(--a),rgba(255,255,255,.55) var(--b),transparent var(--b)),var(--track)}
input[type=range].sl-range.colored::-webkit-slider-runnable-track{background:var(--track)}
input[type=range].sl-range.colored::-moz-range-track{background:var(--track)}
input[type=range].sl-range::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4px;border-radius:50%;background:#cfcfcf;border:1px solid #111;box-shadow:0 1px 2px rgba(0,0,0,.6)}
input[type=range].sl-range::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#cfcfcf;border:1px solid #111}
input[type=range].sl-range:hover::-webkit-slider-thumb{background:#fff}
input[type=range].sl-range:focus-visible{outline:none}
input[type=range].sl-range:focus-visible::-webkit-slider-thumb{background:var(--safelight)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:var(--ink-2);border:0;padding:3px 9px;color:var(--text-dim);font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#4a4a4d;color:var(--text-bright)}

/* Mitte */
.center{grid-area:center;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
.toolbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--ink-1);border-bottom:1px solid #000;min-height:40px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--text-dim);white-space:nowrap}
.readout{font:11px var(--font-num);color:var(--text-dim);white-space:nowrap;min-width:150px;text-align:right}
.view{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#glCanvas,#overlay{position:absolute;left:0;top:0;display:block}
#glCanvas{box-shadow:0 2px 18px rgba(0,0,0,.45)}
#overlay{pointer-events:none}
#stage.crop #overlay{pointer-events:auto}
#stage.zoomed{cursor:grab}
#stage.zoomed.panning{cursor:grabbing}
#stage.fit{cursor:zoom-in}
#stage.picker,#stage.picker #overlay{cursor:crosshair}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-dim);pointer-events:none;text-align:center;padding:20px}
.badge{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.6);color:var(--text-bright);padding:3px 8px;border-radius:3px;font-size:12px;pointer-events:none}
.badge.r{left:auto;right:12px}

/* Bibliotheksraster */
#grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,170px),1fr));gap:8px;align-content:start;background:#232324}
.cell{background:#3a3a3b;border:1px solid #1a1a1a;border-radius:2px;display:flex;flex-direction:column;cursor:pointer;user-select:none;position:relative}
.cell:hover{background:#444446}
.cell.sel{background:#5a5a5c}
.cell.cur{outline:2px solid var(--safelight);outline-offset:-1px}
.cell .num-i{position:absolute;left:6px;top:3px;font:20px/1 var(--font-num);color:rgba(255,255,255,.12);pointer-events:none}
.cell-img{aspect-ratio:1;position:relative}
.cell-img img{position:absolute;inset:0;margin:auto;max-width:74%;max-height:74%;box-shadow:0 1px 5px rgba(0,0,0,.55);display:block}
.cell.rejected .cell-img img{opacity:.3}
.cell-meta{display:flex;align-items:center;justify-content:space-between;padding:2px 7px 5px;font-size:11px;min-height:20px;gap:4px}
.cell-name{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stars{letter-spacing:1px;color:var(--text-bright);white-space:nowrap}
.stars .off{color:rgba(255,255,255,.18)}
.flag{font-size:12px;line-height:1}
.flag.pick{color:var(--text-bright)}
.flag.rej{color:var(--danger)}
.edited-dot{width:6px;height:6px;border-radius:50%;background:var(--safelight);flex:none}
.empty{grid-column:1/-1;display:grid;place-items:center;gap:12px;padding:60px 20px;color:var(--text-dim);text-align:center}

/* Filmstreifen */
.film{grid-area:film;background:var(--ink-0);border-top:1px solid #000;display:flex;flex-direction:column;min-width:0}
.film-h{display:flex;align-items:center;gap:10px;padding:3px 10px;font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden}
.film-h b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
#film{flex:1;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding:0 8px 6px;scrollbar-width:thin;scrollbar-color:#444 transparent}
.fthumb{flex:none;height:100%;aspect-ratio:1.25;background:#2a2a2b;border:1px solid #000;cursor:pointer;position:relative}
.fthumb img{position:absolute;inset:0;margin:auto;max-width:calc(100% - 8px);max-height:calc(100% - 8px);display:block}
.fthumb.sel{background:#4a4a4c}
.fthumb.cur{outline:2px solid var(--safelight);outline-offset:-2px}
.fthumb .stars{position:absolute;left:3px;bottom:1px;font-size:8px;text-shadow:0 0 2px #000}
.fthumb.rejected img{opacity:.3}

/* Histogramm */
.histo-wrap{padding:10px 12px 8px;background:var(--ink-1);border-bottom:1px solid #0c0c0c;position:relative}
#histo{width:100%;height:112px;display:block;background:#141415;border-radius:2px;cursor:ew-resize}
.histo-info{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font:11px var(--font-num);color:var(--text-dim);min-height:15px}
.histo-zone{position:absolute;right:16px;top:14px;font-size:11px;color:var(--text-bright);background:rgba(0,0,0,.55);padding:1px 6px;border-radius:2px;pointer-events:none}
.tools{display:flex;gap:4px;padding:8px 12px;background:var(--ink-1);border-bottom:1px solid #0c0c0c;flex-wrap:wrap}
.tools .btn{flex:1;font-size:12px;padding:4px 6px}

/* Kurve */
#curve{width:100%;aspect-ratio:1;display:block;background:#161617;border-radius:2px;touch-action:none;cursor:crosshair}
.curve-ch button[data-ch="r"][aria-pressed="true"]{background:#7a3030}
.curve-ch button[data-ch="g"][aria-pressed="true"]{background:#2f6a32}
.curve-ch button[data-ch="b"][aria-pressed="true"]{background:#2f477f}

/* Farbräder */
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.wheel-box{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wheel-box .lbl{font-size:11px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase}
.wheel{position:relative;width:100%;max-width:118px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#8a8a8a 0,rgba(128,128,128,.0) 70%),conic-gradient(from 90deg,hsl(0 70% 50%),hsl(60 70% 50%),hsl(120 70% 50%),hsl(180 70% 50%),hsl(240 70% 50%),hsl(300 70% 50%),hsl(360 70% 50%));box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);touch-action:none;cursor:crosshair}
.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(27,27,28,.35);pointer-events:none}
.puck{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;z-index:1;pointer-events:none}
.wheel-val{font:11px var(--font-num);color:var(--text-dim)}
.wheel-box .sl{grid-template-columns:minmax(0,1fr) 38px;width:100%}
.wheel-box .sl .sl-label{display:none}
.wheel-box .sl .sl-num{width:38px}

/* Vorgaben & Verlauf */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:2px;cursor:pointer;color:var(--text);background:none;border:0;text-align:left;width:100%}
.li:hover{background:var(--ink-3)}
.li.on{background:#3f3f42;color:var(--text-bright)}
.li .x{margin-left:auto;opacity:0;color:var(--text-dim);background:none;border:0;padding:0 4px}
.li:hover .x{opacity:1}
.li.future{color:var(--text-dim);font-style:italic}
.grp{font-size:11px;color:var(--text-dim);padding:6px 8px 2px;letter-spacing:.06em;text-transform:uppercase}
#navigator{width:100%;display:block;background:#141415;border-radius:2px;cursor:pointer}
.field{background:var(--ink-0);border:1px solid var(--line);border-radius:3px;padding:4px 7px;min-width:0;flex:1}

/* Metadaten */
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12px}
.meta dt{color:var(--text-dim)}
.meta dd{margin:0;overflow-wrap:anywhere}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;padding:0 2px;font-size:17px;color:rgba(255,255,255,.2)}
.rate button.on{color:var(--text-bright)}
.qd{display:grid;grid-template-columns:76px repeat(4,1fr);gap:4px;align-items:center}
.qd .btn{padding:3px 0;font-size:11px}

/* Dialoge */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--ink-1);border:1px solid var(--line);border-radius:4px;width:min(440px,100%);max-height:90%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg h2{margin:0;padding:12px 16px;font-size:14px;font-weight:600;border-bottom:1px solid #000;background:var(--ink-2)}
.dlg .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid #000}
.form-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.keys kbd{font:11px var(--font-num);background:var(--ink-0);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap;justify-self:start}
#toast{position:fixed;left:50%;bottom:calc(var(--film-h) + 16px);transform:translateX(-50%);background:#000;color:var(--text-bright);padding:7px 14px;border-radius:3px;border:1px solid var(--line);z-index:60;font-size:12px;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast[hidden]{display:block!important;opacity:0}
#drop{position:fixed;inset:0;z-index:70;background:rgba(17,17,18,.85);display:grid;place-items:center;border:3px dashed var(--safelight);font-size:18px;color:var(--text-bright);pointer-events:none}
#boot{position:fixed;inset:0;z-index:80;background:var(--ink-0);display:grid;place-items:center;color:var(--text-dim);gap:14px;text-align:center;padding:20px}
#boot .brand-mark{width:34px;height:34px;margin:0 auto 12px;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 6px rgba(224,112,60,.25)}to{box-shadow:0 0 26px rgba(224,112,60,.7)}}
@media (prefers-reduced-motion:reduce){#boot .brand-mark{animation:none}}

.only-narrow{display:none!important}
.t-short{display:none}
@media (max-width:1100px){:root{--left-w:210px;--right-w:286px}}
@media (max-width:900px){
  #app{grid-template-columns:0 minmax(0,1fr) var(--right-w)}
  .side.left{display:none}
  #app.show-left .side.left{display:block;position:fixed;left:0;top:var(--top-h);bottom:var(--film-h);width:260px;z-index:30;box-shadow:8px 0 30px rgba(0,0,0,.6)}
  .only-narrow{display:inline-flex!important}
}
@media (max-width:640px){
  :root{--film-h:72px;--top-h:44px}
  body{overflow:hidden}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,46dvh) minmax(0,1fr) var(--film-h);grid-template-areas:"top" "center" "right" "film"}
  .side.right{border-left:0;border-top:1px solid #000}
  #app.library{grid-template-rows:var(--top-h) minmax(0,1fr) auto var(--film-h)}
  #app.library .side.right{max-height:34dvh}
  .brand small,.brand-name{display:none}
  .topbar{gap:6px;padding:0 8px}
  .modules{margin-left:0}
  .modules button{padding:6px 6px;font-size:14px}
  .top-actions{margin-left:auto}
  .top-actions .btn{padding:4px 7px;font-size:12px}
  #btnHelp,#btnClip,.brand{display:none}
  .t-long{display:none}.t-short{display:inline}
  .readout{display:none}
  .toolbar{gap:6px;padding:5px 8px}
  #grid{--cell:120px!important;padding:8px;gap:6px}
  #app.show-left .side.left{top:var(--top-h);bottom:0;width:min(280px,86vw)}
}
</style>
</head>
<body>
<div id="app" class="develop">
  <header class="topbar">
    <button class="btn icon only-narrow" id="btnLeft" aria-label="Linke Palette ein-/ausblenden">☰</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Dunkelkammer</span> <small>Fotoentwicklung</small></div>
    <nav class="modules" aria-label="Module">
      <button data-mod="library" aria-pressed="false">Bibliothek</button>
      <button data-mod="develop" aria-pressed="true">Entwickeln</button>
    </nav>
    <div class="top-actions">
      <button class="btn" id="btnImport" title="Fotos importieren"><span class="t-long">Importieren</span><span class="t-short">Import</span></button>
      <button class="btn primary" id="btnExport" title="Exportieren (Strg+E)"><span class="t-long">Exportieren</span><span class="t-short">Export</span></button>
      <button class="btn icon" id="btnHelp" title="Tastaturkürzel (?)" aria-label="Tastaturkürzel">?</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
  </header>

  <aside class="side left" aria-label="Linke Palette">
    <!-- Bibliothek links -->
    <div class="pane" data-pane="library">
      <section class="sec" data-sec="catalog">
        <button class="sec-h">Katalog</button>
        <div class="sec-b"><div class="list" id="catalogList"></div></div>
      </section>
      <section class="sec" data-sec="filter">
        <button class="sec-h">Filter</button>
        <div class="sec-b">
          <input class="field" id="search" type="search" placeholder="Dateiname suchen" aria-label="Dateiname suchen">
          <div class="sub-h">Mindestbewertung</div>
          <div class="rate" id="filterRate"></div>
        </div>
      </section>
    </div>
    <!-- Entwickeln links -->
    <div class="pane" data-pane="develop">
      <section class="sec" data-sec="nav">
        <button class="sec-h">Navigator <span class="sec-x num" id="navZoom">Einpassen</span></button>
        <div class="sec-b"><canvas id="navigator" width="440" height="300"></canvas></div>
      </section>
      <section class="sec" data-sec="presets">
        <button class="sec-h">Vorgaben</button>
        <div class="sec-b">
