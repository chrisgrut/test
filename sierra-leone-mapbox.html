<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sierra Leone</title>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap');

  :root {
    --text: #2c2924;
    --text-mid: #4a4640;
    --cap: #b43020;
    --ocean-text: #5a7a94;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%; overflow:visible;
    font-family:'IBM Plex Sans',sans-serif;
    background: linear-gradient(135deg, #e8eef4 0%, #f2f0eb 40%, #dce6ed 100%);
    display:flex; align-items:center; justify-content:center;
  }

  /* ── Layout wrapper ── */
  .layout-wrap {
    position:relative;
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
  }

  /* ── Main circle ── */
  .circle-main {
    width:100%; height:100%;
    border-radius:50%;
    overflow:hidden;
    border:4px solid rgba(255,255,255,0.85);
    box-shadow: 0 8px 40px rgba(0,0,0,0.12), 0 2px 10px rgba(0,0,0,0.08);
  }
  #main-map { width:100%; height:100%; }

  /* ── Globe circle ── */
  .circle-globe {
    position:absolute;
    width: min(22vh, 22vw);
    height: min(22vh, 22vw);
    min-width:140px; min-height:140px;
    border-radius:50%;
    overflow:hidden;
    border:none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    background: #b4c5d3;
    z-index:200;
    bottom: -6%;
    right: -6%;
  }
  #globe-map { width:100%; height:100%; }

  /* ── City markers ── */
  .pin { display:flex; align-items:center; gap:4px; pointer-events:none; }
  .pin .d {
    width:5px; height:5px; border-radius:50%;
    background:#2c2924; flex-shrink:0;
  }
  .pin .n {
    font-family:'IBM Plex Sans',sans-serif;
    font-size:11px; font-weight:500;
    color:var(--text); white-space:nowrap;
    text-shadow: 1px 1px 2px rgba(255,255,240,0.8), -1px -1px 2px rgba(255,255,240,0.8),
                 0 0 4px rgba(200,210,180,0.9);
  }

  /* Capital marker */
  .cap-marker {
    width:12px; height:12px; position:relative;
    pointer-events:none;
  }
  .cap-marker::before {
    content:''; position:absolute; inset:0;
    border:1.5px solid var(--cap);
    border-radius:50%;
  }
  .cap-marker::after {
    content:''; position:absolute;
    top:50%; left:50%; width:4px; height:4px;
    background:var(--cap); border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .cap-pin { display:flex; align-items:center; gap:5px; pointer-events:none; }
  .cap-pin .n {
    font-family:'IBM Plex Sans Condensed',sans-serif;
    font-size:11.5px; font-weight:600;
    color:var(--text); white-space:nowrap;
    letter-spacing:0.3px; text-transform:uppercase;
    text-shadow: 1px 1px 2px rgba(255,255,240,0.8), -1px -1px 2px rgba(255,255,240,0.8),
                 0 0 4px rgba(200,210,180,0.9);
  }

  /* ── Country labels ── */
  .country-label {
    font-family:'IBM Plex Sans Condensed',sans-serif;
    font-weight:600; white-space:nowrap;
    pointer-events:none; letter-spacing:2px;
    text-transform:uppercase;
  }
  .country-label.main {
    font-size:16px; color:#3a3a30;
    letter-spacing:5px; font-weight:700;
    text-shadow: 1px 1px 3px rgba(200,210,180,0.8);
  }
  .country-label.neighbor {
    font-size:13px; color:rgba(50,50,40,0.50);
    letter-spacing:4px;
  }
  .country-label.neighbor-small {
    font-size:10px; color:rgba(50,50,40,0.40);
    letter-spacing:2.5px;
  }
  .ocean-label {
    font-family:'Libre Baskerville',serif;
    font-style:italic; font-size:13px;
    color:var(--ocean-text); white-space:nowrap;
    pointer-events:none; letter-spacing:3px;
  }

  /* Globe canvas background = ocean color (removes white ring) */
  .circle-globe .mapboxgl-canvas { background: #b4c5d3 !important; }

  /* Hide Mapbox controls inside circles */
  .mapboxgl-ctrl-attrib { font-size:8px !important; opacity:0.4; }
  .mapboxgl-ctrl-group { display:none !important; }
  .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { opacity:0.3; }
</style>
</head>
<body>

<div class="layout-wrap">
  <div class="circle-main">
    <div id="main-map"></div>
  </div>
  <div class="circle-globe" id="globe-wrap">
    <div id="globe-map"></div>
  </div>
</div>

<script>
mapboxgl.accessToken = new URLSearchParams(window.location.search).get('token') || 'YOUR_MAPBOX_TOKEN';

// ── Data ──
var CITIES = [
  {name:'Freetown',      lat:8.4844, lng:-13.2317, cap:true},
  {name:'Bo',            lat:7.9647, lng:-11.7383},
  {name:'Kenema',        lat:7.8769, lng:-11.1872},
  {name:'Makeni',        lat:8.8833, lng:-12.0444},
  {name:'Koidu',         lat:8.6439, lng:-10.85},
  {name:'Port Loko',     lat:8.7667, lng:-12.7872},
  {name:'Kabala',        lat:9.5833, lng:-11.55},
  {name:'Bonthe',        lat:7.5264, lng:-12.505},
  {name:'Moyamba',       lat:8.1592, lng:-12.4314},
  {name:'Kailahun',      lat:8.2772, lng:-10.5736},
  {name:'Magburaka',     lat:8.7167, lng:-11.95},
  {name:'Lunsar',        lat:8.6833, lng:-12.5333},
  {name:'Pendembu',      lat:8.0972, lng:-10.6917},
  {name:'Waterloo',      lat:8.3381, lng:-13.07},
  {name:'Tongo Fields',  lat:8.35,   lng:-11.25, suffix:'(Bomi)'},
];

var NEIGHBOR_CITIES = [
  {name:'Conakry',    lat:9.5092, lng:-13.7122, cap:true},
  {name:'Fria',       lat:10.3667,lng:-13.55},
  {name:'Koundou',    lat:9.53,   lng:-10.85},
  {name:'Fodédou',    lat:9.30,   lng:-10.65},
  {name:'Guékédou',   lat:8.5636, lng:-10.1314},
  {name:'Koindu',     lat:8.48,   lng:-10.35},
];

var COUNTRY_LABELS = [
  {text:'Sierra Leone', lat:8.46, lng:-11.78, cls:'main'},
  {text:'Guinea',        lat:10.50, lng:-11.50, cls:'neighbor'},
  {text:'Liberia',       lat:7.10,  lng:-10.50, cls:'neighbor'},
  {text:'Mali',          lat:10.70, lng:-10.00, cls:'neighbor-small'},
  {text:'Guinea-Bissau', lat:10.20, lng:-14.20, cls:'neighbor-small'},
  {text:'Senegal',       lat:10.95, lng:-13.00, cls:'neighbor-small'},
];

var ROTATED_LABELS = [
  {text:"Côte d'Ivoire", lat:7.50, lng:-9.20, cls:'neighbor-small', rotate:-72},
];

// ═══════════════════════════════
//  STYLE OVERRIDES (minimal — custom style handles colors)
// ═══════════════════════════════
function applyAtlasStyle(map) {
  map.getStyle().layers.forEach(function(layer) {
    var id = layer.id;

    // Hide built-in text/symbol layers (we add our own markers/labels)
    if (layer.type === 'symbol') {
      map.setLayoutProperty(id, 'visibility', 'none');
    }
  });
}

// ═══════════════════════════════
//  MAIN MAP
// ═══════════════════════════════
var mainMap = new mapboxgl.Map({
  container: 'main-map',
  style: 'mapbox://styles/smartiveag/cmnw3x377005a01s6aswga8oo',
  center: [-11.78, 8.46],
  zoom: 7.0,
  minZoom: 5,
  maxZoom: 14,
  attributionControl: true,
});

mainMap.on('style.load', function() {
  applyAtlasStyle(mainMap);
});

mainMap.on('load', function() {
  // ── Sierra Leone fill (official boundaries) ──
  mainMap.addSource('country-boundaries', {
    type: 'vector',
    url: 'mapbox://mapbox.country-boundaries-v1'
  });

  // ── Wash out ALL countries EXCEPT Sierra Leone ──
  // This makes SL stand out with full terrain detail
  mainMap.addLayer({
    id: 'neighbors-wash', type: 'fill',
    source: 'country-boundaries',
    'source-layer': 'country_boundaries',
    filter: ['!=', ['get', 'iso_3166_1_alpha_3'], 'SLE'],
    paint: {'fill-color': '#e0ddd4', 'fill-opacity': 0.45}
  });

  // ── Subtle green tint on Sierra Leone ──
  mainMap.addLayer({
    id: 'sl-fill', type: 'fill',
    source: 'country-boundaries',
    'source-layer': 'country_boundaries',
    filter: ['==', ['get', 'iso_3166_1_alpha_3'], 'SLE'],
    paint: {'fill-color': '#8a9e6e', 'fill-opacity': 0.15}
  });

  // ── Sierra Leone border ──
  mainMap.addLayer({
    id: 'sl-border', type: 'line',
    source: 'country-boundaries',
    'source-layer': 'country_boundaries',
    filter: ['==', ['get', 'iso_3166_1_alpha_3'], 'SLE'],
    paint: {'line-color': 'rgba(60,55,45,0.5)', 'line-width': 1.5}
  });

  // ── City markers ──
  addCityMarkers(CITIES, mainMap);
  addCityMarkers(NEIGHBOR_CITIES, mainMap);

  // ── Country labels ──
  COUNTRY_LABELS.forEach(function(lbl) {
    var el = document.createElement('div');
    el.className = 'country-label ' + lbl.cls;
    el.textContent = lbl.text;
    new mapboxgl.Marker({element:el, anchor:'center'})
      .setLngLat([lbl.lng, lbl.lat]).addTo(mainMap);
  });

  ROTATED_LABELS.forEach(function(lbl) {
    var el = document.createElement('div');
    el.className = 'country-label ' + lbl.cls;
    el.textContent = lbl.text;
    el.style.transform = 'rotate(' + lbl.rotate + 'deg)';
    new mapboxgl.Marker({element:el, anchor:'center'})
      .setLngLat([lbl.lng, lbl.lat]).addTo(mainMap);
  });

  // ── Ocean label ──
  var oceanEl = document.createElement('div');
  oceanEl.className = 'ocean-label';
  oceanEl.innerHTML = 'Atlantic<br>Ocean';
  oceanEl.style.textAlign = 'center';
  oceanEl.style.lineHeight = '1.6';
  new mapboxgl.Marker({element:oceanEl, anchor:'center'})
    .setLngLat([-13.6, 7.35]).addTo(mainMap);

  initGlobe();
});

function addCityMarkers(cities, map) {
  cities.forEach(function(city) {
    var el = document.createElement('div');
    var label = city.name + (city.suffix ? ' ' + city.suffix : '');
    if (city.cap) {
      el.className = 'cap-pin';
      el.innerHTML = '<div class="cap-marker"></div><span class="n">' + label + '</span>';
    } else {
      el.className = 'pin';
      el.innerHTML = '<span class="d"></span><span class="n">' + label + '</span>';
    }
    new mapboxgl.Marker({element:el, anchor:'left', offset:[4,0]})
      .setLngLat([city.lng, city.lat]).addTo(map);
  });
}

mainMap.on('move', syncGlobe);

// ═══════════════════════════════
//  GLOBE
// ═══════════════════════════════
var globe;

function initGlobe() {
  globe = new mapboxgl.Map({
    container: 'globe-map',
    style: 'mapbox://styles/smartiveag/cmnw3x377005a01s6aswga8oo',
    center: [15, 5],
    zoom: 1.8,
    interactive: true,
    attributionControl: false,
  });

  globe.scrollZoom.disable();
  globe.doubleClickZoom.disable();

  globe.on('load', function() {
    // Hide all labels on globe too
    globe.getStyle().layers.forEach(function(layer) {
      if (layer.type === 'symbol') {
        globe.setLayoutProperty(layer.id, 'visibility', 'none');
      }
    });

    globe.addSource('viewport-box', {type:'geojson', data:boundsGeoJSON()});
    globe.addLayer({
      id:'vp-line', type:'line', source:'viewport-box',
      paint:{'line-color':'#c04030', 'line-width':2, 'line-opacity':0.9}
    });
    syncGlobe();

    // Hide globe controls
    document.querySelectorAll(
      '#globe-wrap .mapboxgl-ctrl-bottom-left,#globe-wrap .mapboxgl-ctrl-bottom-right'
    ).forEach(function(el) { el.style.display='none'; });

    // Delay resize + recenter to ensure container is properly laid out
    setTimeout(function() {
      globe.resize();
      globe.setCenter([17, 3]);
      globe.setZoom(0);
      syncGlobe();
    }, 300);
  });

  var obs = new MutationObserver(function() {
    document.querySelectorAll(
      '#globe-wrap .mapboxgl-ctrl-bottom-left,#globe-wrap .mapboxgl-ctrl-bottom-right'
    ).forEach(function(el) { el.style.display='none'; });
  });
  obs.observe(document.getElementById('globe-wrap'), {childList:true, subtree:true});
}

function boundsGeoJSON() {
  var b = mainMap.getBounds();
  return {type:'Feature', geometry:{type:'Polygon', coordinates:[[
    [b.getWest(),b.getSouth()],[b.getEast(),b.getSouth()],
    [b.getEast(),b.getNorth()],[b.getWest(),b.getNorth()],
    [b.getWest(),b.getSouth()]
  ]]}};
}

function syncGlobe() {
  if (!globe || !globe.getSource('viewport-box')) return;
  globe.getSource('viewport-box').setData(boundsGeoJSON());
}
</script>
</body>
</html>
